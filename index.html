    <!-- The tab icon is the avatar itself, same file the social card uses.
         iOS ignores WebP for touch icons, so that one stays PNG. -->
    <link rel="icon" type="image/png" href="/og-image.png" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kanata Reina",
        "alternateName": ["@KanataReinaCh", "@Kanata_Reina"],
        "description": "Virtual YouTuber Indonesia. Isekai, love witch. Cover dan live.",
        "url": "https://kanatareina.vtube-info.xyz/",
        "image": "https://kanatareina.vtube-info.xyz/media/avatar-youtube.webp",
        "sameAs": [
          "https://www.youtube.com/@KanataReinaCh",
          "https://x.com/Kanata_Reina",
          "https://www.facebook.com/KanataReina",
          "https://www.instagram.com/kanata_reina",
          "https://www.tiktok.com/@kanatareina"
        ]
      }
    </script>

    <script>
      // Runs before first paint so the correct token set is already on screen.
      // Without this, a dark-mode visitor eats one light flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem("reina-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
